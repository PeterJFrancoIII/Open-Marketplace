name: Deploy to Cloudflare Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Test Pages asset routing
        run: node --test tests/pages-worker-assets.test.mjs

      - name: Package Pages worker
        run: |
          npx --no-install esbuild scripts/pages-worker-entry.mjs \
            --bundle \
            --format=esm \
            --platform=browser \
            "--external:node:*" \
            "--external:cloudflare:*" \
            --outfile=dist/client/_worker.js

      - name: Check deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable." >&2
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing CLOUDFLARE_API_TOKEN repository secret." >&2
            exit 1
          }

      - name: Configure non-production Pages preview bindings
        if: github.ref_name != 'main'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.PAGES_PREVIEW_BETTER_AUTH_SECRET }}
          MARKETPLACE_ADMIN_EMAILS: ${{ vars.PAGES_PREVIEW_ADMIN_EMAILS }}
          PREVIEW_D1_DATABASE_ID: 8ddff0ae-f810-4d71-955e-4aab40a00e27
          FACEBOOK_CLIENT_ID: ${{ vars.PAGES_PREVIEW_FACEBOOK_CLIENT_ID }}
          FACEBOOK_CLIENT_SECRET: ${{ secrets.PAGES_PREVIEW_FACEBOOK_CLIENT_SECRET }}
          PAYPAL_CLIENT_ID: ${{ vars.PAGES_PREVIEW_PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAGES_PREVIEW_PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENV: ${{ vars.PAGES_PREVIEW_PAYPAL_ENV }}
          PARCEL_MONKEY_USER_ID: ${{ vars.PAGES_PREVIEW_PARCEL_MONKEY_USER_ID }}
          PARCEL_MONKEY_API_TOKEN: ${{ secrets.PAGES_PREVIEW_PARCEL_MONKEY_API_TOKEN }}
        run: node scripts/configure-pages-preview.mjs

      - name: Deploy to Cloudflare Pages
        run: |
          npx --no-install wrangler pages deploy dist/client \
            --project-name open-marketplace-demo \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
