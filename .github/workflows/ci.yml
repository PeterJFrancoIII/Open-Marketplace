name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependency audit
        run: |
          if npm audit --omit=dev; then
            exit 0
          fi
          test -f docs/dependency-advisories.md
          echo "Audit reported findings; reviewed exception is recorded in docs/dependency-advisories.md"
      - run: npm run test:migrations
